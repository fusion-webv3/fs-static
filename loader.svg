<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xhtml="http://www.w3.org/1999/xhtml"
    width="100%"
    height="100%"
>
    <foreignObject id="fo" x="0" y="0" width="100%" height="100%">
        <xhtml:html
            xmlns="http://www.w3.org/1999/xhtml"
            style="width:100%;height:100%;margin:0;padding:0;"
        >
            <xhtml:head>
                <xhtml:meta charset="UTF-8" />

                <xhtml:style>
                    *,
                    *::before,
                    *::after {
                        box-sizing: border-box;
                        margin: 0;
                        padding: 0;
                    }

                    html,
                    body {
                        width: 100%;
                        height: 100%;
                        overflow: hidden;
                        background: #000;
                    }

                    #fm {
                        position: fixed;
                        inset: 0;
                        width: 100%;
                        height: 100%;
                        border: 0;
                        display: block;
                        background: #000;
                    }

                    #loader {
                        position: fixed;
                        inset: 0;
                        z-index: 10;

                        display: flex;
                        align-items: center;
                        justify-content: center;
                        flex-direction: column;
                        gap: 14px;

                        background: #000;
                        color: #fff;

                        font-family:
                            system-ui,
                            -apple-system,
                            BlinkMacSystemFont,
                            "Segoe UI",
                            sans-serif;

                        transition:
                            opacity 0.25s ease,
                            visibility 0.25s ease;
                    }

                    #loader.hidden {
                        opacity: 0;
                        visibility: hidden;
                        pointer-events: none;
                    }

                    .spinner {
                        width: 34px;
                        height: 34px;

                        border: 3px solid rgba(255, 255, 255, 0.2);
                        border-top-color: #fff;
                        border-radius: 50%;

                        animation: spin 0.8s linear infinite;
                    }

                    #status {
                        font-size: 14px;
                        opacity: 0.8;
                        text-align: center;
                    }

                    #error {
                        position: fixed;
                        inset: 0;
                        z-index: 20;

                        display: none;
                        align-items: center;
                        justify-content: center;
                        flex-direction: column;
                        gap: 12px;

                        padding: 24px;

                        background: #000;
                        color: #fff;

                        font-family:
                            system-ui,
                            -apple-system,
                            BlinkMacSystemFont,
                            "Segoe UI",
                            sans-serif;

                        text-align: center;
                    }

                    #error.visible {
                        display: flex;
                    }

                    #error-title {
                        font-size: 20px;
                        font-weight: 600;
                    }

                    #error-message {
                        max-width: 600px;
                        font-size: 14px;
                        line-height: 1.5;
                        opacity: 0.7;
                    }

                    #retry {
                        margin-top: 6px;
                        padding: 9px 16px;

                        border: 0;
                        border-radius: 6px;

                        background: #fff;
                        color: #000;

                        font-size: 14px;
                        cursor: pointer;
                    }

                    #retry:hover {
                        opacity: 0.85;
                    }

                    @keyframes spin {
                        from {
                            transform: rotate(0deg);
                        }

                        to {
                            transform: rotate(360deg);
                        }
                    }
                </xhtml:style>
            </xhtml:head>

            <xhtml:body>
                <xhtml:iframe
                    id="fm"
                    title="Embedded content"
                    src="about:blank"
                ></xhtml:iframe>

                <xhtml:div id="loader">
                    <xhtml:div class="spinner"></xhtml:div>
                    <xhtml:div id="status">Loading...</xhtml:div>
                </xhtml:div>

                <xhtml:div id="error">
                    <xhtml:div id="error-title">
                        Unable to load content
                    </xhtml:div>

                    <xhtml:div id="error-message">
                        Something went wrong while loading the remote page.
                    </xhtml:div>

                    <xhtml:button id="retry" type="button">
                        Try Again
                    </xhtml:button>
                </xhtml:div>

                <xhtml:script>
                    //<![CDATA[
                    (() => {
                        "use strict";

                        const REMOTE_URL =
                            "https://cdn.jsdelivr.net/gh/fusion-webv3/fs-static@main/index.html";

                        const REQUEST_TIMEOUT = 15000;

                        const iframe = document.getElementById("fm");
                        const loader = document.getElementById("loader");
                        const status = document.getElementById("status");

                        const errorScreen = document.getElementById("error");
                        const errorMessage =
                            document.getElementById("error-message");
                        const retryButton =
                            document.getElementById("retry");

                        function setLoading(message) {
                            status.textContent = message;

                            loader.classList.remove("hidden");
                            errorScreen.classList.remove("visible");
                        }

                        function hideLoading() {
                            loader.classList.add("hidden");
                        }

                        function showError(message) {
                            hideLoading();

                            errorMessage.textContent = message;
                            errorScreen.classList.add("visible");
                        }

                        async function loadRemotePage() {
                            setLoading("Connecting...");

                            const controller = new AbortController();

                            const timeout = setTimeout(() => {
                                controller.abort();
                            }, REQUEST_TIMEOUT);

                            try {
                                setLoading("Downloading content...");

                                const response = await fetch(
                                    REMOTE_URL,
                                    {
                                        method: "GET",
                                        cache: "no-store",
                                        signal: controller.signal
                                    }
                                );

                                if (!response.ok) {
                                    throw new Error(
                                        `Server returned HTTP ${response.status}`
                                    );
                                }

                                setLoading("Preparing page...");

                                const html = await response.text();

                                if (!html.trim()) {
                                    throw new Error(
                                        "The server returned an empty page."
                                    );
                                }

                                const frameDocument =
                                    iframe.contentDocument ||
                                    iframe.contentWindow.document;

                                if (!frameDocument) {
                                    throw new Error(
                                        "Unable to access the iframe document."
                                    );
                                }

                                frameDocument.open();
                                frameDocument.write(html);
                                frameDocument.close();

                                hideLoading();
                            } catch (error) {
                                console.error(
                                    "Remote page loader error:",
                                    error
                                );

                                if (error.name === "AbortError") {
                                    showError(
                                        "The remote page took too long to respond."
                                    );
                                } else if (
                                    error instanceof TypeError
                                ) {
                                    showError(
                                        "The remote page could not be reached. This may be caused by a network or CORS restriction."
                                    );
                                } else {
                                    showError(
                                        error.message ||
                                        "An unexpected error occurred while loading the page."
                                    );
                                }
                            } finally {
                                clearTimeout(timeout);
                            }
                        }

                        retryButton.addEventListener(
                            "click",
                            loadRemotePage
                        );

                        loadRemotePage();
                    })();
                    //]]>
                </xhtml:script>
            </xhtml:body>
        </xhtml:html>
    </foreignObject>
</svg>